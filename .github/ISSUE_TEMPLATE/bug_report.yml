name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /backdrop
        2. Choose ...
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Live Backdrop, Windows (winver) and the Claude desktop app.
      placeholder: Live Backdrop 0.1.0, Windows 11 24H2, Claude 4.23
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - Live wallpaper (static or slideshow)
        - Live wallpaper (Wallpaper Engine)
        - Picture file
  - type: textarea
    id: log
    attributes:
      label: Overlay log
      description: The last lines of %LOCALAPPDATA%\LiveBackdrop\overlay.log. Remove anything personal.
      render: text
