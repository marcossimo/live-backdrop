name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the overlay
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test overlay/LiveBackdrop.sln -c Release

      - name: Check the version matches the tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $plugin = (Get-Content .claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          [xml]$project = Get-Content overlay/src/LiveBackdrop.csproj
          $overlay = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($plugin -ne $tag -or $overlay -ne $tag) {
            throw "Versions differ (tag ${tag}, plugin.json ${plugin}, LiveBackdrop.csproj ${overlay}); they must match."
          }

      - name: Publish
        run: >
          dotnet publish overlay/src/LiveBackdrop.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md publish/
          Compress-Archive -Path publish/* -DestinationPath LiveBackdrop-win-x64.zip
          (Get-FileHash LiveBackdrop-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  LiveBackdrop-win-x64.zip" |
            Out-File -Encoding ascii LiveBackdrop-win-x64.zip.sha256

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LiveBackdrop-win-x64.zip
            LiveBackdrop-win-x64.zip.sha256
          generate_release_notes: true
