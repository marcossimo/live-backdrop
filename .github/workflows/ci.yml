name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    name: Overlay (build and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build overlay/LiveBackdrop.sln -c Release

      - name: Test
        run: dotnet test overlay/LiveBackdrop.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

  plugin:
    name: Plugin (validate and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate
        run: claude plugin validate .

      - name: Test
        run: claude plugin test .
